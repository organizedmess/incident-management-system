spring:
  application:
    name: incident-management-system

  datasource:
    url: jdbc:postgresql://localhost:5432/incident_db
    username: incident_user
    password: incident_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: incident-management-group

  ai:
    google:
      genai:
        # Gemini Developer API auth (API key only, no GCP project needed).
        # vertex-ai defaults to false, so this stays on the Developer API instead of Vertex AI.
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-2.5-flash
        embedding:
          api-key: ${GEMINI_API_KEY}
          text:
            options:
              model: gemini-embedding-001
              # gemini-embedding-001 natively outputs 3072-dim vectors but supports Matryoshka
              # truncation to smaller officially-supported sizes. Truncated to 768 to match
              # the pgvector column dimensions below.
              dimensions: 768
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768
