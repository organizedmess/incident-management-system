spring:
  server:
    port: ${PORT:8080}

  application:
    name: incident-management-system

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: incident-management-group

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  ai:
    google:
      genai:
        # Gemini Developer API auth (API key only, no GCP project needed).
        # vertex-ai defaults to false, so this stays on the Developer API instead of Vertex AI.
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            # gemini-2.5-flash is blocked by Google for newly-created API keys ahead of its
            # official Oct 2026 retirement (confirmed via 404 "no longer available to new
            # users"). gemini-3.6-flash is Google's current recommended stable fast/cheap model.
            model: gemini-3.6-flash
        embedding:
          api-key: ${GEMINI_API_KEY}
          text:
            options:
              model: gemini-embedding-001
              # gemini-embedding-001 natively outputs 3072-dim vectors but supports Matryoshka
              # truncation to smaller officially-supported sizes. Truncated to 768 to match
              # the pgvector column dimensions below.
              dimensions: 768
    vectorstore:
      pgvector:
        initialize-schema: true
        index-type: HNSW
        distance-type: COSINE_DISTANCE
        dimensions: 768

notification:
  email:
    # Comma-separated list; Spring's relaxed binding converts this into List<String>
    # whether it comes from this default or an env var override.
    recipients: ${NOTIFICATION_EMAIL_RECIPIENTS}

app:
  kafka:
    # When true (default, local dev): incidents flow through Kafka (KafkaLogProducer -> topic -> KafkaLogConsumer).
    # When false (e.g. production without a Kafka broker): DirectIncidentLogProcessor handles
    # persistence + vector-store indexing synchronously, and no Kafka beans are created.
    enabled: ${KAFKA_ENABLED:true}
